apiVersion: v1
kind: ConfigMap
metadata:
  name: meyer-integration-config
  namespace: semerp
data:
  AMQP_URI: "amqp://AMQP_USER:AMQP_PASSWORD@rabbitmq.semerp.svc.cluster.local:5672/semerp"
  AMQP_EXCHANGE: "sem-integration"
  AMQP_DLX: "sem-dlx"
  AMQP_QUEUE: "meyer-integration"
  AMQP_BINDING: "meyer.v1.#"
  MEYER_BASE_URL: "URL_HERE"
  HTTP_PORT: "8081"
  SERVICE_VERSION: "1.0.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: meyer-integration-secrets
  namespace: semerp
type: Opaque
stringData:
  MEYER_USER: "MEYER_USER"
  MEYER_PASSWORD: "1878"
  MEYER_PIN: "MEYER_PIN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meyer-integration
  namespace: semerp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meyer-integration
  template:
    metadata:
      labels:
        app: meyer-integration
    spec:
      containers:
        - name: meyer-integration
          image: semerp/meyer-integration:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: meyer-integration-config
            - secretRef:
                name: meyer-integration-secrets
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: meyer-integration
  namespace: semerp
spec:
  type: ClusterIP
  selector:
    app: meyer-integration
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
